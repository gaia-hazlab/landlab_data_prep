name: remote sources

# The servers behind the config template change without notice (the ScienceBase
# K-factor link broke in 2026). Check weekly that every template source can
# still be read in place, on each operating system.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - src/landlab_data_prep/base.example.yaml
      - src/landlab_data_prep/downloads.py
      - tests/test_remote_sources.py
      - .github/workflows/sources.yml

jobs:
  read:
    name: template sources on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the package
        run: pip install -e ".[dev]"
      - name: Read every remote source for a small AOI
        run: python -m pytest -v -m network tests
